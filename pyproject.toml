[project]
name = "geeky_audiomixer"
description = "Audio Mixing node for ComfyUI"
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["# ComfyUI Geeky AudioMixer Node Requirements", "# Core audio processing", "soundfile>=0.12.1", "numpy>=1.21.0", "# PyTorch audio for high-quality resampling and audio processing", "torchaudio>=0.13.0", "# Optional but recommended for additional audio processing", "scipy>=1.9.0", "# JSON handling (usually included with Python)", "# json - built-in module", "# File operations (built-in modules)", "# os, tempfile, time - built-in modules", "# Note: torch is already available in ComfyUI environment"]

[project.urls]
Repository = "https://github.com/GeekyGhost/ComfyUI_Geeky_AudioMixer"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/GeekyGhost/ComfyUI_Geeky_AudioMixer/wiki"
"Bug Tracker" = "https://github.com/GeekyGhost/ComfyUI_Geeky_AudioMixer/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI_Geeky_AudioMixer"
Icon = ""
includes = [] 
